volumes:
  pg_data_production:
  static_volume:

services:
  db:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data_production:/vat/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 1s
      timeout: 5s
      retries: 5
  
  backend:
    image: coolzpot/taski_backend
    env_file: .env
    volumes:
      - static_volume:/backend_static
    depends_on:
      db:
        condition: service_healthy
  
  frontend:
    image: coolzpot/taski_frontend
    env_file: .env
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static_volume:/frontend_static
    
  gateway:
    image: coolzpot/taski_gateway
    env_file: .env
    depends_on:
      - backend
      - frontend
    volumes:
      - static_volume:/staticfiles/
    ports:
      - 8000:80